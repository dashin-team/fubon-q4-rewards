<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="img/logo.png"><link rel="apple-touch-icon" href="img/logo.png">
<title>獎勵辦法</title>
<style>
:root{--b:#0a5ea8;--bg:#f4f7fb;--t:#1d2733}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--t);line-height:1.5}
header{background:linear-gradient(135deg,#0a5ea8,#1f9d6b);color:#fff;padding:18px 16px}header h1{margin:0;font-size:1.3rem}header p{margin:4px 0 0;opacity:.9;font-size:.85rem}
main{max-width:960px;margin:auto;padding:10px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:11px 4px;border:2px solid var(--b);background:#fff;color:var(--b);border-radius:12px;font-weight:800;font-size:1.05rem}
.tabs button.on{background:var(--b);color:#fff}
.def{background:#fff8e6;border:1px solid #f0d58a;border-radius:12px;padding:10px;font-size:.88rem;margin-top:6px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.strip div{flex:0 0 auto;background:#fff;border-radius:10px;padding:5px 9px;font-size:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.07);max-width:150px}
.strip b{display:block;color:var(--b);font-size:.85rem}
h2{font-size:1.1rem;margin:20px 0 4px;display:flex;align-items:center;gap:6px}
.card{background:#fff;border-radius:16px;margin:10px 0;box-shadow:0 1px 5px rgba(0,0,0,.08);overflow:hidden;border-top:6px solid var(--c)}
.card .hd{padding:12px 14px 4px}.card h3{margin:0;font-size:1.05rem}.no{font-size:.75rem;color:#6a7787}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;padding:4px 14px;font-size:.85rem}.kv b{color:var(--c);white-space:nowrap}
.tw{padding:0 14px}table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.88rem}
th{background:var(--c);color:#fff;padding:6px;text-align:left;font-weight:700}td{padding:6px;border-bottom:1px solid #eef1f5}
tr:nth-child(odd) td{background:var(--l)}td:last-child{font-weight:800;color:var(--c);text-align:right}
.key{margin:4px 14px;font-size:.82rem;color:#4a5866;background:#f6f8fb;border-radius:8px;padding:6px 8px}
.warn{color:#b05a00}.soon{display:inline-block;margin-top:5px;background:#fff1e6;color:#c0392b;border:1px solid #f5b38a;border-radius:8px;padding:2px 8px;font-size:.8rem;font-weight:800}
.btn{display:block;margin:10px 14px 14px;padding:11px;text-align:center;background:var(--c);color:#fff;border-radius:12px;text-decoration:none;font-weight:800}
.btn2{display:inline-block;margin:0 14px 12px;font-size:.85rem;color:var(--c)}
.yr{display:flex;gap:6px;margin:8px 0}.yr button{flex:1;padding:8px;border:2px solid #1f9d6b;background:#fff;color:#1f9d6b;border-radius:10px;font-weight:700}.yr button.on{background:#1f9d6b;color:#fff}
img.info{width:100%;border-radius:12px;border:1px solid #ddd;display:block}
.docs a{display:flex;justify-content:space-between;gap:8px;background:#fff;padding:8px 10px;border-radius:8px;margin:4px 0;text-decoration:none;color:var(--t);font-size:.82rem}.docs a span:last-child{color:var(--b);white-space:nowrap}
header{display:flex;flex-direction:row;align-items:center;gap:12px}.ht{min-width:0}header h1{font-size:1.55rem!important;font-weight:900;letter-spacing:1px}.lb{flex:0 0 auto;width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}.logo{height:54px;width:auto}.slogan{font-size:.95rem;font-weight:700;opacity:.95}
.rip{position:fixed;width:40px;height:40px;margin:-20px 0 0 -20px;background:url(img/logo.png) center/contain no-repeat;pointer-events:none;z-index:99;opacity:.5;animation:rp .45s ease-out forwards}@keyframes rp{from{transform:scale(.6)}to{transform:scale(1.7);opacity:0}}@media (prefers-reduced-motion:reduce){.rip{display:none}}
footer{text-align:center;font-size:.78rem;color:#6a7787;padding:20px 10px}
body.locked header,body.locked main,body.locked footer{display:none}
#login{display:none;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(135deg,#0a5ea8,#1f9d6b)}
body.locked #login{display:flex}
.lg{width:100%;max-width:360px;background:#fff;border-radius:20px;padding:26px 20px 22px;box-shadow:0 8px 30px rgba(0,0,0,.2);text-align:center}
.lg .lb{margin:0 auto 10px;width:76px;height:76px;box-shadow:0 2px 8px rgba(0,0,0,.15)}.lg .logo{height:60px}
.lg h1{margin:0;font-size:1.7rem;font-weight:900;letter-spacing:2px;color:#0a5ea8}.lg .sub{font-size:.85rem;color:#6a7787;margin:2px 0 16px}
.lg label{display:block;text-align:left;font-weight:700;font-size:.9rem;margin:10px 0 4px}
.lg input{width:100%;padding:12px;font-size:1.05rem;border:2px solid #d5dde8;border-radius:12px;outline:none}.lg input:focus{border-color:#0a5ea8}
.lg button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:#0a5ea8;color:#fff;font-size:1.1rem;font-weight:800}
.lg button:disabled{opacity:.6}
#lerr{min-height:1.3em;margin-top:10px;color:#c0392b;font-weight:700;font-size:.9rem}
.out{color:#6a7787;text-decoration:underline;cursor:pointer;background:none;border:0;font-size:.78rem;padding:4px}
</style></head><body class="locked">
<div id="login"><form class="lg" id="lform" autocomplete="on">
<span class="lb"><img class="logo" src="img/logo.png" alt="大心"></span>
<h1>獎勵辦法</h1><div class="sub">富邦人壽 115年第四季｜請先登入</div>
<label for="lu">帳號</label><input id="lu" name="username" autocomplete="username" required>
<label for="lp">密碼</label><input id="lp" name="password" type="password" autocomplete="current-password" required>
<button id="lbtn" type="submit">登入</button><div id="lerr" role="alert"></div>
</form></div>
<header><span class="lb"><img class="logo" src="img/logo.png" alt="大心"></span><div class="ht"><h1>獎勵辦法</h1><div class="slogan">台南最大心，服務最用心</div><p>富邦人壽 115年第四季｜以原始公文為準</p></div></header>
<main>
<div class="sticky"><div class="tabs" id="gtabs"></div></div>
<div class="def" id="gdef"></div>
<div class="strip" id="strip"></div>
<div id="xrsec"></div>
<div id="rules"></div>
<h2>📚 原始公文</h2><div class="docs" id="docs"></div>
</main>
<footer>資料以公司公文為準｜更新 115/11/03<br>如有疑義請洽業務活動部／業務行銷部承辦同仁<br><button class="out" id="logout" type="button">登出</button></footer>
<script src="data.enc.js"></script>
<script>
(()=>{const H='65e3c3d07ffc169dc4bf778817542333c93fa044ee21ab8e5429a63455ad0ee9',LS='fqr-k1',S=window.crypto&&crypto.subtle,te=new TextEncoder();
const b2u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),u2b=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const err=t=>{document.getElementById('lerr').textContent=t};
async function sha(s){const d=await S.digest('SHA-256',te.encode(s));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function derive(p){const b=await S.importKey('raw',te.encode(p),'PBKDF2',false,['deriveKey']);return S.deriveKey({name:'PBKDF2',salt:b2u(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},b,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open(k){const pt=await S.decrypt({name:'AES-GCM',iv:b2u(ENC.iv)},k,b2u(ENC.ct));const s=document.createElement('script');s.textContent=new TextDecoder().decode(pt);document.body.classList.remove('locked');document.body.appendChild(s)}
document.getElementById('logout').onclick=()=>{try{localStorage.removeItem(LS)}catch(e){}location.reload()};
if(!S||!window.ENC){err('請用 https 網址開啟（瀏覽器不支援加密）');return}
const saved=(()=>{try{return localStorage.getItem(LS)}catch(e){return null}})();
if(saved)S.importKey('raw',b2u(saved),'AES-GCM',false,['decrypt']).then(open).catch(()=>{try{localStorage.removeItem(LS)}catch(e){}});
document.getElementById('lform').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('lbtn');err('');
 const u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value.trim().toUpperCase();
 btn.disabled=true;btn.textContent='登入中…';
 try{if(await sha(u+'|'+p)!==H)throw 0;const k=await derive(p);await open(k);try{localStorage.setItem(LS,u2b(await S.exportKey('raw',k)))}catch(e){}}
 catch(x){err('帳號或密碼錯誤');btn.disabled=false;btn.textContent='登入'}};
})();
</script></body></html>
