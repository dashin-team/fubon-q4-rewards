<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>富邦人壽 115年第四季 競賽獎勵總覽</title>
<style>
:root{--b:#0a5ea8;--bg:#f4f7fb;--t:#1d2733}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--t);line-height:1.5}
header{background:linear-gradient(135deg,#0a5ea8,#1f9d6b);color:#fff;padding:18px 16px}header h1{margin:0;font-size:1.3rem}header p{margin:4px 0 0;opacity:.9;font-size:.85rem}
main{max-width:960px;margin:auto;padding:10px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:11px 4px;border:2px solid var(--b);background:#fff;color:var(--b);border-radius:12px;font-weight:800;font-size:1.05rem}
.tabs button.on{background:var(--b);color:#fff}
.def{background:#fff8e6;border:1px solid #f0d58a;border-radius:12px;padding:10px;font-size:.88rem;margin-top:6px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.strip div{flex:0 0 auto;background:#fff;border-radius:10px;padding:5px 9px;font-size:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.07);max-width:150px}
.strip b{display:block;color:var(--b);font-size:.85rem}
h2{font-size:1.1rem;margin:20px 0 4px;display:flex;align-items:center;gap:6px}
.card{background:#fff;border-radius:16px;margin:10px 0;box-shadow:0 1px 5px rgba(0,0,0,.08);overflow:hidden;border-top:6px solid var(--c)}
.card .hd{padding:12px 14px 4px}.card h3{margin:0;font-size:1.05rem}.no{font-size:.75rem;color:#6a7787}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;padding:4px 14px;font-size:.85rem}.kv b{color:var(--c);white-space:nowrap}
.tw{padding:0 14px}table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.88rem}
th{background:var(--c);color:#fff;padding:6px;text-align:left;font-weight:700}td{padding:6px;border-bottom:1px solid #eef1f5}
tr:nth-child(odd) td{background:var(--l)}td:last-child{font-weight:800;color:var(--c);text-align:right}
.key{margin:4px 14px;font-size:.82rem;color:#4a5866;background:#f6f8fb;border-radius:8px;padding:6px 8px}
.warn{color:#b05a00}
.btn{display:block;margin:10px 14px 14px;padding:11px;text-align:center;background:var(--c);color:#fff;border-radius:12px;text-decoration:none;font-weight:800}
.btn2{display:inline-block;margin:0 14px 12px;font-size:.85rem;color:var(--c)}
.yr{display:flex;gap:6px;margin:8px 0}.yr button{flex:1;padding:8px;border:2px solid #1f9d6b;background:#fff;color:#1f9d6b;border-radius:10px;font-weight:700}.yr button.on{background:#1f9d6b;color:#fff}
img.info{width:100%;border-radius:12px;border:1px solid #ddd;display:block}
.docs a{display:flex;justify-content:space-between;gap:8px;background:#fff;padding:8px 10px;border-radius:8px;margin:4px 0;text-decoration:none;color:var(--t);font-size:.82rem}.docs a span:last-child{color:var(--b);white-space:nowrap}
footer{text-align:center;font-size:.78rem;color:#6a7787;padding:20px 10px}
</style></head><body>
<header><h1>🏆 115年第四季 競賽獎勵總覽</h1><p>富邦人壽｜依身分查看適用獎勵・以原始公文為準</p></header>
<main>
<div class="sticky"><div class="tabs" id="gtabs"></div></div>
<div class="def" id="gdef"></div>
<div class="strip" id="strip"></div>
<div id="xrsec"></div>
<div id="rules"></div>
<h2>📚 原始公文</h2><div class="docs" id="docs"></div>
</main>
<footer>資料以公司公文為準｜更新 115/10/11<br>如有疑義請洽業務活動部／業務行銷部承辦同仁</footer>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let G='xx',Y='114';
const CAT={'第四季主競賽':['🏆','#0a5ea8','#eef4fb'],'保障型專案':['🛡️','#1f9d6b','#edf8f2'],'整合行銷':['💳','#7b3fb5','#f5effb'],'增員／榮耀':['🤝','#d9741c','#fdf3ea'],'新人專案':['🌱','#c23a6b','#fcedf3']};
// 簡短期間與結算日（摘自各公文 period 欄）
const S={'125':['115/9/30～12/28','116/1/28'],'127':['115/9/30～10/1','115/11/5'],'128':['115/9/30～12/28','116/1/28'],'129':['115/9/30～12/28','116/1/28'],'130':['115/9/30～12/28','116/1/28'],'132':['同第125號','116/1/28'],'133':['同第125號','依第125號'],'455':['115/9/30～12/28','116/1/25'],'452':['115/9/30～10/27','結案11/25・簽收12/10'],'448':['115/9/30～10/27','結案11/25・簽收12/10'],'442':['115/9/30～12/28','結案116/1/25・簽收2/10'],'440':['115/9/30～10/27','結案11/25・簽收12/10'],'408':['第9月 8/26～9/29；第10月 9/30～10/27','第9月 10/27；第10月 11/25'],'443':['一重 10/1～12/31進件；二重 9/30～12/28','核卡116/1/31；入帳116/1/7'],'398':['第9～12工作月','每月公告'],'094':['第三季＋第四季','依季競賽']};
const KEY={'125':'須持續任職CA/NCT以上；月獎金結案：10月→11/27、11月→12/28、12月→116/1/28。超標／高標獎勵請見原文。','127':'僅兩天受理，請把握！','128':'不含投資型；最高50萬為上限，各檻擇優。','129':'特定商品：VCAT、VCBT、VCBF、VCCT、VCCF、VCET、UOP、UND。','132':'115年第三季完成新銳培訓並結訓者；僅核發一次。','133':'同時取得多組資格以1人為限。','455':'須個人FYC累計達4萬；商品清單請見原文。','452':'獎勵＝比例×實收總保費。','448':'取代第408號第10工作月金額。⚠️「20萬→26,666元」與每萬1,000元推算不一致，請見原文。','442':'對象：投資型月配息及已領生存金客戶；商品清單見附件。','440':'以首期實收保費計算。','408':'第10工作月金額已由第448號調整，請以448號為準。','443':'新戶：從未申辦北富銀信用卡或剪卡超過180天。','398':'榮耀曝光（無獎金）。','094':'本辦法「新人」為115/7–12工作月報聘者，定義與第125號不同。旅遊：日本沖繩。'};
const tabs=[['xx','🌟 新新人'],['xr','🌱 新人'],['gr','👤 個人組']];
$('#gtabs').innerHTML=tabs.map(([k,v])=>`<button data-g="${k}">${v}</button>`).join('');
$('#gtabs').onclick=e=>{const b=e.target.closest('button');if(b){G=b.dataset.g;render()}};
const tbl=r=>'<table>'+r.map((row,i)=>'<tr>'+row.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')+'</tr>').join('')+'</table>';
function card(cat,name,no,period,settle,tables,key,pdf,pdf2){const [ic,c,l]=CAT[cat];
 return `<div class="card" style="--c:${c};--l:${l}"><div class="hd"><h3>${ic} ${esc(name)}</h3><div class="no">${esc(no)}</div></div>
 <div class="kv"><b>📅 期間</b><span>${esc(period)}</span><b>🏁 結算日</b><span>${esc(settle)}</span></div>
 <div class="tw">${tables.map(tbl).join('')}</div>${key?`<div class="key">${esc(key).replace('⚠️','<span class="warn">⚠️')}${key.includes('⚠️')?'</span>':''}</div>`:''}
 <a class="btn" href="pdf/${pdf}" target="_blank" rel="noopener">📄 看原始公文</a>${pdf2?`<a class="btn2" href="pdf/${pdf2}" target="_blank" rel="noopener">📎 附件商品清單</a>`:''}</div>`}
const XRT={'114':[[['月月獎金','月核實FYC','獎金'],['第1–12個月','2萬','10,000元'],['第1–12個月','3萬','15,000元'],['第1–12個月','4萬','18,000元'],['第13–24個月','3萬','6,000元'],['第13–24個月','4萬','10,000元']],[['季通算（補發差額）','季核實FYC','獎金'],['第1–12個月','7.5萬','30,000元'],['第1–12個月','10.5萬','45,000元'],['第1–12個月','13.5萬','54,000元'],['第13–24個月','10.5萬','18,000元'],['第13–24個月','13.5萬','30,000元']],[['年度加碼（僅第一年）','年核實FYC','獎金'],['第一年','36萬','24,000元'],['第一年','48萬','32,000元'],['第一年','60萬','44,000元'],['第一年','72萬以上','60,000元']]],
'115':[[['月月獎金','月核實FYC','獎金'],['第1–6個月','1.5萬','10,000元'],['第7–12個月','2萬','10,000元'],['第13–24個月','3萬','10,000元']],[['績效獎金（季）','季核實FYC','獎金'],['第1–6個月','6萬','10,000元'],['第7–12個月','7.5萬','10,000元'],['第13–24個月','9萬','10,000元']],[['定著加碼','年核實FYC','獎金'],['第一年（第13個月）','24萬','12,000元'],['第一年（第13個月）','36萬','24,000元'],['第一年（第13個月）','48萬','32,000元'],['第二年（第25個月）','36萬','24,000元'],['第二年（第25個月）','48萬','32,000元'],['第二年（第25個月）','60萬','44,000元']]]};
const XRK={'114':'每月活動參與率70%＋期限內完成產險（6個工作月內）、外幣收付非投資型（12個工作月內）證照登錄。季通算須扣除已領月月獎金；年度加碼另需至少9個月領月月獎金且第四季FYC≧4.5萬。整合行銷、宜花東加碼等請見原文。',
 '115':'每月活動參與率70%＋期限內完成產險（6個工作月內）、外幣收付非投資型（12個工作月內）證照登錄；定著加碼須第13／25個月仍任職CA以上。活動量、整合行銷、宜花東加碼等請見原文。'};
function xrsec(){if(G==='gr'){$('#xrsec').innerHTML='';return}const d=XINREN[Y];
 const no=Y==='114'?'(113)富壽業企發字第143號（114/1–12工作月新聘CA）':'(114)富壽業企發字第196號（115/1–12工作月新聘CA）';
 $('#xrsec').innerHTML=`<h2>🌱 新人專案（依報聘年度）</h2><div class="yr" id="ytabs"><button data-y="114">114年登錄</button><button data-y="115">115年登錄</button></div>`
 +card('新人專案',Y==='114'?'114年新人績效獎勵專案':'115年新人績效暨定著獎勵專案',no,'自報聘當工作月起二年內','依各月／季／年結算（請見原文）',XRT[Y],XRK[Y],d.pdf)
 +`<a href="${d.img}" target="_blank"><img class="info" src="${d.img}" alt="${Y}年新人獎勵圖" loading="lazy"></a><div class="no" style="margin:4px 0">${Y}年新人獎勵圖（點圖放大）</div>`;
 document.querySelectorAll('#ytabs button').forEach(b=>b.classList.toggle('on',b.dataset.y===Y));
 $('#ytabs').onclick=e=>{if(e.target.dataset.y){Y=e.target.dataset.y;xrsec()}}}
function render(){document.querySelectorAll('#gtabs button').forEach(b=>b.classList.toggle('on',b.dataset.g===G));
 $('#gdef').innerHTML=`<b>${GROUPS[G].name}定義</b>：${esc(GROUPS[G].def)}`;
 const rs=RULES.filter(r=>r.groups.includes(G));
 const ds={};rs.forEach(r=>{(S[r.id][1].match(/1\d\d\/\d+\/\d+|\d+\/\d+/g)||[]).forEach(x=>{})});
 const strip=[['10/1','首二日受理截止'],['10/27','第10工作月受理截止'],['11/25','第10工作月結案'],['12/28','Q4受理截止'],['116/1/25','442・455結案'],['116/1/28','Q4主競賽結案']];
 $('#strip').innerHTML=strip.map(([a,b])=>`<div><b>${a}</b>${b}</div>`).join('');
 xrsec();let h='',cat='';
 rs.forEach(r=>{if(r.cat!==cat){cat=r.cat;h+=`<h2>${CAT[cat][0]} ${cat}</h2>`}
  const t=[];if(r.tables.all)t.push(r.tables.all);if(r.tables[G])t.push(r.tables[G]);
  h+=card(r.cat,r.name,r.no,S[r.id][0],S[r.id][1],t,KEY[r.id],r.pdf,r.pdf2)});
 $('#rules').innerHTML=h}
const docs=RULES.map(r=>[r.no,r.name,r.pdf]).concat(RULES.filter(r=>r.pdf2).map(r=>[r.no+' 附件','商品清單',r.pdf2]),[['(113)富壽業企發字第143號','114年新人績效獎勵專案','113-143-xinren.pdf'],['(114)富壽業企發字第196號','115年新人績效暨定著獎勵專案','114-196-xinren.pdf']]);
$('#docs').innerHTML=docs.map(d=>`<a href="pdf/${d[2]}" target="_blank" rel="noopener"><span>${esc(d[1])}<br><small style="color:#6a7787">${esc(d[0])}</small></span><span>📄 開啟</span></a>`).join('');
render();
</script></body></html>
